name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Smoke test (import + parse)
        run: python -c "import app, zendesk_importer, enhanced_zendesk_exporter, html_to_docx; print('ok')"

      - name: Build exe
        run: pyinstaller --noconfirm --clean TechWitchImportExportApp.spec

      - name: Check the exe starts
        shell: pwsh
        run: |
          $env:NO_BROWSER = "1"
          $env:PORT = "5111"
          $p = Start-Process -FilePath "dist\TechWitchImportExportApp.exe" -PassThru
          Start-Sleep -Seconds 12
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:5111/health" -UseBasicParsing
          Write-Host $r.Content
          Stop-Process -Id $p.Id -Force
          if ($r.StatusCode -ne 200) { exit 1 }

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\TechWitchImportExportApp.exe -Algorithm SHA256).Hash.ToLower()
          "$h  TechWitchImportExportApp.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TechWitchImportExportApp-windows
          path: |
            dist/TechWitchImportExportApp.exe
            dist/SHA256SUMS.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TechWitchImportExportApp.exe
            dist/SHA256SUMS.txt
